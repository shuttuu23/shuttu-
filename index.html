<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> pedikkanda phonin onnu aavulaa thornnokkyok </title>
<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
}
.container {
    text-align: center;
    color: white;
    padding: 20px;
}
h1 {
    font-size: 45px;
    margin-bottom: 20px;
}
p {
    font-size: 22px;
    margin-bottom: 40px;
    line-height: 1.4;
    min-height: 60px; /* Prevents layout shifting when text changes */
}
.buttons {
    position: relative;
    width: 100%;
    max-width: 400px;
    height: 120px;
    margin: auto;
}
button {
    padding: 15px 25px;
    font-size: 18px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    touch-action: none; /* Prevents default phone zooming/scrolling on double tap */
    white-space: nowrap; /* Keeps the text on a single line */
}
#yesBtn {
    background: white;
    color: #ff4d6d;
    position: absolute;
    left: 10px;
}
#noBtn {
    background: #ff4d6d;
    color: white;
    position: absolute;
    right: 10px;
    transition: 0.1s ease;
}
#message {
    margin-top: 40px;
    font-size: 28px;
    display: none;
    line-height: 1.4;
}
</style>
</head>
<body>

<div class="container">
    <h1>Happy Birthday ❤️</h1>
    
    <p id="mainQuestion">ithil nink stickerum emojim itt oyvakan patulaa...korch ishtm ille annod 😌?</p>
    
    <div class="buttons">
        <button id="yesBtn">ishtaan/ishtaavu❤️</button>
        <button id="noBtn">ishtavan chance koravaan🚶</button>
    </div>
    
    <div id="message">
        nanni indd...santhoshaayi..❤️..neritt parnjoo tta begm😉
    </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const mainQuestion = document.getElementById("mainQuestion");

// Keeps track of how many times she tried to hit the NO button
let prankCount = 0;

function moveButton() {
    prankCount++;

    // Dynamic dialogue changes based on how many times she targets the NO button
    if (prankCount === 1) {
        mainQuestion.innerHTML = "ithil nink stickerum emojim itt oyvakan patulaa...korch ishtm ille annod 😌?<br><br><span style='font-size: 24px; font-weight: bold;'>nerit parnjaathy ishtaavumbo 🥲❤️</span>";
    } else if (prankCount === 2) {
        mainQuestion.innerHTML = "please reject aakkanda shuttu...";
    } else if (prankCount === 3) {
        mainQuestion.innerHTML = "leftil njekk....";
    } else if (prankCount === 4) {
        mainQuestion.innerHTML = "agna parayallaa...pavalle njan";
    } else if (prankCount >= 5) {
        mainQuestion.innerHTML = "reject aaki madthille...eni onn accept aakikude";
    }

    // Math to keep the longer text button safely on-screen
    const x = Math.floor(Math.random() * (window.innerWidth - 260));
    const y = Math.floor(Math.random() * (window.innerHeight - 60));
    
    noBtn.style.position = "fixed";
    noBtn.style.left = Math.max(10, x) + "px";
    noBtn.style.top = Math.max(10, y) + "px";
}

// Works for Desktop Mouse hover
noBtn.addEventListener("mouseover", moveButton);

// Works perfectly for Phone screen touches!
noBtn.addEventListener("touchstart", (e) => {
    e.preventDefault(); // Stops the actual click from happening on mobile
    moveButton();
});

// Ultimate backup: Just in case they somehow click it
noBtn.addEventListener("click", (e) => {
    e.preventDefault();
    moveButton();
});

document.getElementById("yesBtn").addEventListener("click", () => {
    document.getElementById("message").style.display = "block";
    noBtn.style.display = "none"; // Hide the NO button once YES is clicked
    document.querySelector('.buttons').style.display = "none"; // Hide button container
    mainQuestion.style.display = "none"; // Hide the original question text
});
</script>

</body>
</html>
