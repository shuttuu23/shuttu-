<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> pedikkanda phonin onnu aavulaa thornnokk </title>
<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
}
.container {
    text-align: center;
    color: white;
}
h1 {
    font-size: 50px;
    margin-bottom: 20px;
}
p {
    font-size: 24px;
    margin-bottom: 40px;
}
.buttons {
    position: relative;
    width: 300px;
    height: 100px;
    margin: auto;
}
button {
    padding: 15px 30px;
    font-size: 20px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    touch-action: none; /* Prevents default phone zooming/scrolling on double tap */
}
#yesBtn {
    background: white;
    color: #ff4d6d;
    position: absolute;
    left: 20px;
}
#noBtn {
    background: #ff4d6d;
    color: white;
    position: absolute;
    right: 20px;
    transition: 0.1s ease;
}
#message {
    margin-top: 40px;
    font-size: 32px;
    display: none;
}
</style>
</head>
<body>

<div class="container">
    <h1>Happy Birthday ❤️</h1>
    <p>ithil nink stickerum emojim  itt oyvakan patulaa...korch ishtm ille annod 😌? nerit parnjaathy ishtaavumbo 🥲❤️  </p>
    <div class="buttons">
        <button id="yesBtn">ishtaan ❤️</button>
        <button id="noBtn">ishtavan chance koravaan🚶</button>
    </div>
    <div id="message">
        nanni indd...santhoshaayi..❤️..neritt parnjoo tta begm😉
    </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");

function moveButton() {
    // Math to keep the button fully visible inside any mobile/desktop screen
    const x = Math.floor(Math.random() * (window.innerWidth - 120));
    const y = Math.floor(Math.random() * (window.innerHeight - 60));
    
    noBtn.style.position = "fixed";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

// Works for Desktop Mouse hover
noBtn.addEventListener("mouseover", moveButton);

// Works perfectly for Phone screen touches!
noBtn.addEventListener("touchstart", (e) => {
    e.preventDefault(); // Stops the actual click from happening on mobile
    moveButton();
});

// Ultimate backup: Just in case they somehow click it
noBtn.addEventListener("click", (e) => {
    e.preventDefault();
    alert("Nice try, but you can't say no! 😜");
    moveButton();
});

document.getElementById("yesBtn").addEventListener("click", () => {
    document.getElementById("message").style.display = "block";
    noBtn.style.display = "none"; // Hide the NO button once YES is clicked
});
</script>

</body>
</html>
