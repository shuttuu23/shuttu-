<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> pedikkanda phonin onnu aavulaa thornnokkyok </title>
<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
}
.container {
    text-align: center;
    color: white;
    padding: 20px;
    max-width: 90%;
    z-index: 2; 
}
h1 {
    font-size: 45px;
    margin-bottom: 20px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
}
p {
    font-size: 22px;
    margin-bottom: 40px;
    line-height: 1.4;
    min-height: 80px; 
}
.buttons {
    position: relative;
    width: 100%;
    max-width: 400px;
    height: 120px;
    margin: auto;
}
button {
    padding: 15px 25px;
    font-size: 18px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    touch-action: none; 
    white-space: nowrap; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    transition: transform 0.2s ease;
}
#yesBtn {
    background: white;
    color: #ff4d6d;
    position: absolute;
    left: 10px;
}
#yesBtn:active {
    transform: scale(0.95); 
}
#noBtn {
    background: #ff4d6d;
    color: white;
    position: absolute;
    right: 10px;
    transition: left 0.15s ease-out, top 0.15s ease-out;
}
#message {
    margin-top: 40px;
    font-size: 28px;
    display: none;
    line-height: 1.4;
    animation: fadeIn 0.5s ease-in-out;
}

/* Corner Footer Styling */
.corner-footer {
    position: fixed;
    bottom: 15px;
    right: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.2);
    padding: 6px 12px;
    border-radius: 30px;
    backdrop-filter: blur(5px);
    z-index: 10;
}
.corner-footer img {
    width: 35px;
    height: 35px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid white;
}
.corner-footer span {
    color: white;
    font-size: 14px;
    font-weight: bold;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="container">
    <h1>Happy Birthday ❤️</h1>
    
    <p id="mainQuestion">ithil nink stickerum emojim itt oyvakan patulaa...korch ishtm ille annod 😌?</p>
    
    <div class="buttons">
        <button id="yesBtn">ishtaan/ishtaavu❤️</button>
        <button id="noBtn">ishtavan chance koravaan🚶</button>
    </div>
    
    <div id="message">
        nanni indd...santhoshaayi..❤️..neritt parnjoo tta begm😉
    </div>
</div>

<div class="corner-footer">
    <img src="https://i.ibb.co/G4xTVfVj/IMG-9934.png" alt="Profile Photo">
    <span>Ee nishkalankamaaya mugham kandit egna nink reject aakan thoninne?</span>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const mainQuestion = document.getElementById("mainQuestion");

let prankCount = 0;

function moveButton() {
    prankCount++;

    if (prankCount === 1) {
        mainQuestion.innerHTML = "ithil nink stickerum emojim itt oyvakan patulaa...korch ishtm ille annod 😌?<br><span style='font-size: 20px; font-weight: bold; color: #ffe3e8;'>nerit parnjaathy ishtaavumbo 🥲❤️</span>";
    } else if (prankCount === 2) {
        mainQuestion.innerHTML = "please reject aakkanda shuttu...";
    } else if (prankCount === 3) {
        mainQuestion.innerHTML = "leftil njekk....";
    } else if (prankCount === 4) {
        mainQuestion.innerHTML = "korch soft aakuo heart 🥲😌?";
    } else if (prankCount === 5) {
        mainQuestion.innerHTML = "agna parayallaa...pavalle njan";
    } else if (prankCount >= 6) {
        mainQuestion.innerHTML = "reject aaki madthille...eni onn accept aakikude";
    }

    const btnWidth = noBtn.offsetWidth || 180;
    const btnHeight = noBtn.offsetHeight || 50;
    
    const maxX = window.innerWidth - btnWidth - 40;
    const maxY = window.innerHeight - btnHeight - 80; 

    const x = Math.floor(Math.random() * (maxX - 30) + 30);
    const y = Math.floor(Math.random() * (maxY - 30) + 30);
    
    noBtn.style.position = "fixed";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("touchstart", (e) => {
    e.preventDefault(); 
    moveButton();
});
noBtn.addEventListener("click", (e) => {
    e.preventDefault();
    moveButton();
});

document.getElementById("yesBtn").addEventListener("click", () => {
    document.getElementById("message").style.display = "block";
    noBtn.style.display = "none"; 
    document.querySelector('.buttons').style.display = "none"; 
    mainQuestion.style.display = "none"; 
});
</script>

</body>
</html>
